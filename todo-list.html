<!DOCTYPE html>
<html>
<head>
           <title>My To-Do List</title>

<style>
     body {
     font-family: Georgia;
     background-color: white;
     color: #222;
     text-align: center;
   }
 h1 {
      color: #2c6e91;
}
 input {
     font-size: 18px;
     padding: 10px;
     border-radius: 6px;
     border: 1px solid #ccc;
}
  button {
        font-size: 18px;
        padding: 10px 20px;
        border-radius: 6px;
        background-color: #2c6e91;
        color: white;
        border: none;
        margin-left: 8px;
  }
  ul {
       list-style: none;
       padding: 0;
       max-width: 400px;
       margin: 20px auto;
 }
  li {
       background-color: #f2f2f2;
       padding: 12px;
       margin: 8px 0;
       border-radius: 6px;
       font-size: 18px;
       cursor: pointer;
 }
  .done   {
           text-decoration: line-through;
           color: #999;
    }
</style>
</head>
<body>

<h1>My To-Do List</h1>

<input type="text" id="taskInput" placeholder="Enter a task"> <button onclick="addTask()">Add Task</button>
<ul id="taskList"></ul>

<script>

function addTask() {
  var taskText = document.getElementById("taskInput").value;
  var listItem = document.createElement("li");
  listItem.textContent = taskText;
  listItem.onclick = function() {
    listItem.classList.toggle("done");
  };
  document.getElementById("taskList").appendChild(listItem);
  document.getElementById("taskInput").value = "";
}

</script>

</body>
</html>
