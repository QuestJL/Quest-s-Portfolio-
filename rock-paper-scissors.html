<!DOCTYPE html>
<html>
<head>

               <title>Rock, Paper, Scissors</title>

               <style>
     body   {
                    background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
                    min-height: 100vh;
                    margin: 0; 
                    color: #f0f0f0;
                    text-align: center;
        }

     button  {

                   background-color: #84f5ed;
                   color: #0f0c29;
                   font-size: 20px;
                   padding: 16px 20px;
                   border: none;
                   border-radius: 12px;
                   cursor: pointer;
                   margin: 8px;
                   box-shadow: 0 0 20px #5ee0d6;
                   transition: transform 0.3s;
     }

    button:hover {
                  background-color: #5ee0d6;
                  
    }

    button:active {
                  transform: scale(0.92);
    }

    #result {
                  font-size: 24px;
                  font-weight: bold;
                  margin-top: 24px;
    }

    .win { 
                  color: #4ade80;
    }

    .lose {
                 color: #f87171;
    }

    .tie {
                 color: #cbd5e1;
    }
     </style>
   </head>
 <body>

   <h1>Rock, Paper, Scissors</h1>
<div class="button">
<button onclick="play('rock')">Rock</button>
<button onclick="play('paper')">Paper</button>
<button onclick="play('scissors')">Scissors</button>
</div>
<p id="result"></p>

<script>

function play(userChoice)  {
       var choices = ["rock", "paper", "scissors"];
       var computerChoice = choices[Math.floor(Math.random() * 3)];

       var outcome;
       var resultClass;

       if (userChoice === computerChoice)    {
                 outcome = "It's a tie!";
                 resultClass = "tie";
              } else if (
                    (userChoice === "rock" && computerChoice === "scissors")   ||
                    (userChoice === "paper" && computerChoice === "rock")   ||
                    (userChoice === "scissors" && computerChoice === "paper")
             )   {
                outcome = "You win!"; 
                resultClass = "win";
             }   else    {
                 outcome = "You lose";
                 resultClass = "lose";
             }

     var resultElement = document.getElementById("result");
     resultElement.textContent =
          "You chose "  + userChoice + " . Computer chose " + computerChoice + ". " + outcome;
      resultElement.className = resultClass;
             }

</script>

</body>
</html>
